name: Autonomous Market Forecasting

on:
  schedule:
    # Both UTC offsets cover Eastern daylight-saving changes. The worker only
    # acts inside the applicable America/New_York market window.
    - cron: "45 13,14 * * 1-5"
    - cron: "10 20,21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker dependencies
        run: |
          pip install numpy pandas

      - name: Run market-session worker
        run: |
          python autonomous_forecaster.py --mode open
          python autonomous_forecaster.py --mode close

      - name: Commit memory update
        run: |
          git config user.name "AI Learner"
          git config user.email "actions@github.com"

          if [ ! -f prediction_memory.json ]; then
            echo "[]" > prediction_memory.json
          fi

          git add prediction_memory.json

          git diff --cached --quiet || git commit -m "Automatic prediction learning update"

      - name: Push changes
        run: |
          git push
